[project]
name = "ai-stock-research"
version = "0.1.0"
description = "AI 株式リサーチ・売買判断支援ツール（Phase A: WSL2 ローカル実行）"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "UNLICENSED" }

# ワークスペース全体の共通依存。
# services/api・services/agent・packages/* はすべてこの環境で実行する。
dependencies = [
    # --- API 層 ---
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sse-starlette>=2.1",
    "python-multipart>=0.0.12",
    # --- スキーマ・設定 ---
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    # --- ストレージ ---
    "duckdb>=1.1",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.20",
    "alembic>=1.14",
    "pyarrow>=17.0",
    "numpy>=1.26",
    # pandas 2.3 は groupby.apply(include_groups=True) を禁止し、既存の
    # ファクター/リーク検証が落ちる。2.2 系で固定する。
    "pandas>=2.2,<2.3",
    # --- 分析（connectors / factors / models / backtest / llm / agent）---
    "scipy>=1.14",
    "scikit-learn>=1.5",
    "statsmodels>=0.14",
    "arch>=7.0",
    "lightgbm>=4.5",
    "yfinance>=0.2",
    "requests>=2.32",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "apscheduler>=3.10",
    "litellm>=1.50",
    # --- 共通 ---
    "python-ulid>=3.0",
    "structlog>=24.4",
    "httpx>=0.27",
]

[project.optional-dependencies]
# LanceDB は依存が重く、ベクトル検索を使わない段階では不要。
# 未インストールでも packages.core.storage.vector_store は import できる
# （実際に LanceDBVectorStore を生成した時点で明示的なエラーになる）。
vectors = ["lancedb>=0.15"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-pyyaml>=6.0",
    "pytest-mock>=3.14",
    "respx>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# `packages` と `services` を名前空間ツリーとしてそのまま配置する。
# docs/01-architecture.md §3 のリポジトリ構成に対応させ、
# `python -m packages.schemas.export` / `uvicorn services.api.main:app` を
# カレントディレクトリに依存せず動かすため。
[tool.hatch.build.targets.wheel]
packages = ["packages", "services"]

[tool.uv]
package = true

# ワークスペースのメンバー。
# 各サービスは自分の依存境界を pyproject.toml で宣言するが、実体は
# ルートの wheel に含まれる（[tool.uv] package = false）。
# services/agent を追加する担当者は、ここに "services/agent" を足すこと。
[tool.uv.workspace]
members = ["services/api"]

# ------------------------------------------------------------------
# Ruff（docs/15-windows-runtime.md §4.5）
# PLW1514（unspecified-encoding）が本プロジェクトで最も重要な lint ルール。
# ------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["apps", ".venv"]

[tool.ruff.lint]
select = [
    "E", "F", "W",
    "I",
    "UP",
    "B",
    "PTH",
    "PLW1514",
    "PLW1509",
    "EXE",
    "ASYNC",
    "RUF",
]
ignore = [
    "E501",
    "RUF001", # 日本語コメント中の全角記号を曖昧文字として検出するため無効化
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLW1514"]

[tool.ruff.lint.isort]
known-first-party = ["packages", "services"]

# ------------------------------------------------------------------
# pytest
# ------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
filterwarnings = [
    "error::EncodingWarning",
]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
namespace_packages = true
explicit_package_bases = true
