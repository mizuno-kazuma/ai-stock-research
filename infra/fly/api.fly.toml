# Fly.io — API（APScheduler 内蔵）。小規模運用の推奨構成。
# 使い方:
#   fly apps create ai-stock-api
#   fly volumes create ai_stock_data --region nrt --size 40 -a ai-stock-api
#   fly secrets set -a ai-stock-api DATABASE_URL=... API_TOKEN=... AUTH_MODE=token ...
#   fly deploy -a ai-stock-api -c infra/fly/api.fly.toml

app = "ai-stock-api"
primary_region = "nrt"

[build]
  dockerfile = "infra/docker/Dockerfile.api"

[env]
  DEPLOYMENT_PROFILE = "cloud"
  AUTH_MODE = "token"
  DATA_DIR = "/data"
  API_HOST = "0.0.0.0"
  API_PORT = "8000"
  TZ = "Asia/Tokyo"
  PYTHONUTF8 = "1"
  VECTOR_STORE_BACKEND = "pgvector"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "45s"
    method = "GET"
    path = "/health"

[[mounts]]
  source = "ai_stock_data"
  destination = "/data"
  initial_size = "40gb"

[[vm]]
  size = "shared-cpu-2x"
  memory = "2048mb"
  cpus = 2
